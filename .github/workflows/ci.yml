name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Offline suite only. `vitest.config.ts` excludes the six live-integration
      # files by name from any run that isn't VITEST_LIVE=1, and this workflow
      # never sets ABAP_URL or VITEST_LIVE, so `npm test` here never attempts a
      # real SAP connection. See doc/TESTING/README.md.
      - name: Test
        run: npm test

      - name: Check for leaked hosts/secrets
        run: npm run check:leaks

      - name: Lint guard script
        run: npm run lint:guard

      # Catches caller-facing hint/description text that names a zod field in
      # camelCase when the real schema field is snake_case — an agent that
      # follows such a hint literally burns a round trip on a schema rejection.
      - name: Lint hint parameter names
        run: npm run lint:hints
